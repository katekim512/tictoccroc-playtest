<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- 숫자(가격·나이 등)를 전화번호·날짜 링크로 자동 변환하지 않도록 -->
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>우리 아이 놀이 성향 테스트 · 째깍악어</title>

    <!-- 링크를 붙여넣었을 때 미리보기(OG) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="우리 아이는 어떤 원정대 대원일까요? 🧭"
    />
    <meta
      property="og:description"
      content="딱 9개 질문으로 우리 아이에게 꼭 맞는 원정대를 찾아 떠나요!"
    />
    <!-- 링크 미리보기 이미지: public/og-share.png -->
    <meta property="og:url" content="https://tictoccroc-playtest.vercel.app/" />
    <meta property="og:image" content="https://tictoccroc-playtest.vercel.app/og-share.png" />
    <meta property="og:image:alt" content="우리 아이는 어떤 원정대 대원일까요?" />

    <!-- 트위터/기타 미리보기 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="우리 아이는 어떤 원정대 대원일까요? 🧭" />
    <meta name="twitter:description" content="딱 9개 질문으로 우리 아이에게 꼭 맞는 원정대를 찾아 떠나요!" />
    <meta name="twitter:image" content="https://tictoccroc-playtest.vercel.app/og-share.png" />

    <!-- 카카오 JavaScript SDK -->
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
